debug_swiss_army_knife:
  shortCut: Ctrl-N
  scopes:
    - containers
  description: |
    Debug
  command: bash
  background: true
  args:
    - -c
    - |
      cat <<EOF > /tmp/k9s-debug-profile.yaml
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      EOF
      kubectl \
        --kubeconfig=$KUBECONFIG \
        --context=$CONTEXT \
        --namespace=$NAMESPACE \
        debug \
        $POD \
        --image=leodotcloud/swiss-army-knife \
        --custom=/tmp/k9s-debug-profile.yaml \
        -- \
        sleep 4h
